name: Build and Deploy Nova Ventanas y Puertas (Grupo Soto)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Compilar en Runner & Desplegar en VPS (Frontend + nova-api :3006)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependencias Frontend en Runner
        run: npm ci

      - name: 🔨 Compilar Frontend Angular (SPA + Portal) en Runner (16GB RAM)
        # CRÍTICO: Compilación exclusiva en GitHub Actions Runner.
        run: npm run build

      - name: 📦 Instalar Dependencias de Producción de nova-api en Runner
        run: |
          cd backend
          npm install --omit=dev

      - name: 🗜️ Empaquetar artefactos (Frontend + Backend + Nginx) en tarball atómico
        run: |
          mkdir -p package-staging
          cp -r dist/nova-ventanas-y-puertas/browser package-staging/
          cp -r backend package-staging/
          cp nginx-nova.conf package-staging/
          cp nginx-nova-http.conf package-staging/
          cd package-staging
          tar -czf ../deploy-bundle.tar.gz browser backend nginx-nova.conf nginx-nova-http.conf
          cd ..
          rm -rf package-staging
          echo "📦 Bundle de despliegue generado con éxito:"
          ls -lh deploy-bundle.tar.gz

      - name: 🔐 Verificar permisos y directorios en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /var/www/nova-ventanas-y-puertas /var/www/nova-api /var/www/nova-storage/catalogs /var/www/certbot
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R antigravity:www-data /var/www/nova-ventanas-y-puertas /var/www/nova-api /var/www/nova-storage /var/www/certbot
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod -R 775 /var/www/nova-ventanas-y-puertas /var/www/nova-api /var/www/nova-storage /var/www/certbot

      - name: 📤 Transferir tarball al VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy-bundle.tar.gz"
          target: "/var/www/nova-ventanas-y-puertas"

      - name: 🚀 Extraer artefactos, iniciar nova-api (:3006) y recargar Nginx (Zero-Build en VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/nova-ventanas-y-puertas
            tar -xzf deploy-bundle.tar.gz
            rm -f deploy-bundle.tar.gz

            # Actualizar micro-backend nova-api ya compilado con node_modules de producción
            cp -r /var/www/nova-ventanas-y-puertas/backend/* /var/www/nova-api/
            rm -rf /var/www/nova-ventanas-y-puertas/backend

            # Asegurar esquema PostgreSQL db_nova e iniciar/recargar nova-api en puerto 3006
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S -u postgres psql -f /var/www/nova-api/init-postgres.sql
            cd /var/www/nova-api
            pm2 describe nova-api > /dev/null 2>&1 && pm2 reload nova-api || PORT=3006 pm2 start server.js --name nova-api --max-memory-restart 180M
            pm2 save

            # Permisos de lectura para Nginx
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R antigravity:www-data /var/www/nova-ventanas-y-puertas /var/www/nova-storage
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod -R 775 /var/www/nova-ventanas-y-puertas /var/www/nova-storage

            # Activar configuración Nginx de producción (con /api/v1/ y /catalogs/)
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sed -i '1s/^\xEF\xBB\xBF//' /var/www/nova-ventanas-y-puertas/nginx-nova.conf
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /var/www/nova-ventanas-y-puertas/nginx-nova.conf /etc/nginx/sites-available/novaventanasypuertas.conf
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ln -sf /etc/nginx/sites-available/novaventanasypuertas.conf /etc/nginx/sites-enabled/novaventanasypuertas.conf

            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S nginx -t
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl reload nginx
            echo "✅ Despliegue Full-Stack NOVA completado con éxito."

      - name: 🧪 Smoke Test / Healthcheck Post-Despliegue (Web + Portal + API + DB)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "🔍 Probando Web Pública, Portal y API PostgreSQL db_nova:"
            curl -s -k -I -H "Host: novaventanasypuertas.com" https://127.0.0.1/ | head -n 1
            curl -s -k -I -H "Host: novaventanasypuertas.com" https://127.0.0.1/portal | head -n 1
            curl -s -k -H "Host: novaventanasypuertas.com" https://127.0.0.1/api/v1/health
