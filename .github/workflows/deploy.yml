name: Build and Deploy Nova Ventanas y Puertas (Grupo Soto)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Compilar en Runner & Desplegar en VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependencias en Runner
        run: npm ci

      - name: 🔨 Compilar Frontend Angular (SPA)
        # CRÍTICO: Compilación con 16GB RAM en GitHub Actions Runner.
        # NUNCA ejecutar npm run build en el VPS para evitar saturación de memoria.
        run: npm run build

      - name: 🗜️ Empaquetar artefactos en tarball atómico
        run: |
          mkdir -p package-staging
          cp -r dist/nova-ventanas-y-puertas/browser package-staging/
          cp nginx-nova.conf package-staging/
          cp nginx-nova-http.conf package-staging/
          cd package-staging
          tar -czf ../deploy-bundle.tar.gz browser nginx-nova.conf nginx-nova-http.conf
          cd ..
          rm -rf package-staging
          echo "📦 Bundle de despliegue generado con éxito:"
          ls -lh deploy-bundle.tar.gz

      - name: 🔐 Verificar permisos y directorios en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /var/www/nova-ventanas-y-puertas /var/www/certbot
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R antigravity:www-data /var/www/nova-ventanas-y-puertas /var/www/certbot
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod -R 775 /var/www/nova-ventanas-y-puertas /var/www/certbot

      - name: 📤 Transferir tarball al VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          source: "deploy-bundle.tar.gz"
          target: "/var/www/nova-ventanas-y-puertas"

      - name: 🚀 Extraer artefactos y recargar Nginx en VPS (Zero-Build en VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/nova-ventanas-y-puertas
            tar -xzf deploy-bundle.tar.gz
            rm -f deploy-bundle.tar.gz

            # Asegurar permisos correctos para lectura directa por Nginx (www-data)
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R antigravity:www-data /var/www/nova-ventanas-y-puertas
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod -R 775 /var/www/nova-ventanas-y-puertas

            # Autorizar llave SSH local para acceso interactivo directo
            mkdir -p /home/antigravity/.ssh
            grep -q "bentian-admin-key" /home/antigravity/.ssh/authorized_keys 2>/dev/null || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOdV6uJgbw+HRyCu1reFg9lsVUpcBqTvpxyBlEGbznMN bentian-admin-key" >> /home/antigravity/.ssh/authorized_keys
            chmod 700 /home/antigravity/.ssh
            chmod 600 /home/antigravity/.ssh/authorized_keys

            # Desactivar sitio default de Nginx si existiese para que no capture el puerto 80
            if [ -f /etc/nginx/sites-enabled/default ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S rm -f /etc/nginx/sites-enabled/default
            fi

            # Activar configuración HTTP limpia primero
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /var/www/nova-ventanas-y-puertas/nginx-nova-http.conf /etc/nginx/sites-available/novaventanasypuertas.conf
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ln -sf /etc/nginx/sites-available/novaventanasypuertas.conf /etc/nginx/sites-enabled/novaventanasypuertas.conf

            # Iniciar/recargar Nginx en modo HTTP garantizado
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S nginx -t
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart nginx || echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl start nginx

            # Si no existe certificado, pedirlo por Certbot usando Nginx webroot
            if [ ! -f /etc/letsencrypt/live/novaventanasypuertas.com/fullchain.pem ]; then
              echo "🔑 Solicitando certificado SSL gratuito Let's Encrypt con Certbot..."
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S certbot certonly --webroot -w /var/www/certbot --non-interactive --agree-tos --email info@novaventanasypuertas.com -d novaventanasypuertas.com -d www.novaventanasypuertas.com || true
            fi

            # Si se generó el certificado, activar HTTPS; si no, mantener HTTP
            if [ -f /etc/letsencrypt/live/novaventanasypuertas.com/fullchain.pem ]; then
              echo "🔒 Certificado SSL detectado. Aplicando configuración HTTPS..."
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /var/www/nova-ventanas-y-puertas/nginx-nova.conf /etc/nginx/sites-available/novaventanasypuertas.conf
              if echo "${{ secrets.VPS_PASSWORD }}" | sudo -S nginx -t; then
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl reload nginx
                echo "✅ HTTPS activado correctamente."
              else
                echo "⚠️ Error en HTTPS, volviendo a HTTP..."
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /var/www/nova-ventanas-y-puertas/nginx-nova-http.conf /etc/nginx/sites-available/novaventanasypuertas.conf
                echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart nginx
              fi
            fi
            echo "✅ Despliegue completado."

      - name: 🧪 Smoke Test / Healthcheck Post-Despliegue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.227.248.132
          username: antigravity
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "🔍 Probando respuesta HTTP local en el VPS:"
            curl -s -I -H "Host: novaventanasypuertas.com" http://127.0.0.1/
            echo "🔍 Probando respuesta HTTPS local en el VPS:"
            curl -s -k -I https://127.0.0.1/ -H "Host: novaventanasypuertas.com" || true
