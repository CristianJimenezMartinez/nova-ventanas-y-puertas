# ==============================================================================
# CONFIGURACIÓN TEMPORAL HTTP: NOVA VENTANAS Y PUERTAS
# Para servir el sitio y permitir emisión de certificados Certbot
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name novaventanasypuertas.com www.novaventanasypuertas.com novaventanasypuertas.es www.novaventanasypuertas.es;

    root /var/www/nova-ventanas-y-puertas/browser;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
