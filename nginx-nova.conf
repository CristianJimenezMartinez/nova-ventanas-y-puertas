server {
    server_name novaventanasypuertas.com www.novaventanasypuertas.com novaventanasypuertas.es www.novaventanasypuertas.es;
    root /var/www/nova-ventanas-y-puertas/browser;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    client_max_body_size 15M;
    server_tokens off;

    # Cabeceras de Seguridad HTTP en Producción
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy inverso hacia el micro-backend nova-api (Puerto 3006 -> PostgreSQL db_nova)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3006/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Descarga directa de Catálogos PDF Oficiales Traducidos (Fuera de Git)
    location /catalogs/ {
        alias /var/www/nova-storage/catalogs/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Aplicación Angular 18 (Web Pública + Portal Multitenant /portal)
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/novaventanasypuertas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novaventanasypuertas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name novaventanasypuertas.com www.novaventanasypuertas.com novaventanasypuertas.es www.novaventanasypuertas.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://novaventanasypuertas.com$request_uri;
    }
}
