# ==============================================================================
# CONFIGURACIÓN NGINX: NOVA VENTANAS Y PUERTAS (GRUPO SOTO)
# Ubicación en VPS IONOS: /etc/nginx/sites-available/novaventanasypuertas.conf
# ==============================================================================

# 1. Redirección HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name novaventanasypuertas.com www.novaventanasypuertas.com novaventanasypuertas.es www.novaventanasypuertas.es;

    # Certbot SSL verification challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://novaventanasypuertas.com$request_uri;
    }
}

# 2. Servidor Seguro HTTPS (Producción)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name novaventanasypuertas.com www.novaventanasypuertas.com novaventanasypuertas.es www.novaventanasypuertas.es;

    # Certificados SSL gestionados con Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/novaventanasypuertas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novaventanasypuertas.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Directorio de los archivos compilados de Angular
    root /var/www/nova-ventanas-y-puertas/browser;
    index index.html;

    # Cabeceras de Seguridad OWASP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip para máxima velocidad
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache agresivo para archivos estáticos con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Soporte para Angular SPA Router (Redirigir todo a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Páginas de error
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
