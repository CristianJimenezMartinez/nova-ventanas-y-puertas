<section id="hero" class="nova-hero">
  <!-- Fondo Fotográfico Arquitectónico con Zoom Lento -->
  <div class="nova-hero__media">
    <img 
      src="assets/images/hero-architecture.jpg" 
      alt="Vivienda contemporánea con ventanales de suelo a techo NOVA" 
      class="nova-hero__image" />
    <div class="nova-hero__overlay"></div>
  </div>

  <div class="container nova-hero__container">
    <div class="nova-hero__content">
      
      <!-- Label Tracked -->
      <span class="label-tracked hero-brand-label">
        NOVA · ARQUITECTURA &amp; CERRAMIENTOS
      </span>

      <!-- Titular Principal Arquitectónico -->
      <h1 class="heading-display hero-title">
        DISEÑAMOS ESPACIOS.<br>
        <strong>CREAMOS CONFORT.</strong>
      </h1>

      <!-- Párrafo Subtítulo -->
      <p class="body-editorial hero-lead">
        Ventanas, puertas y cerramientos diseñados para integrarse en el lenguaje arquitectónico de cada proyecto. Precisión milimétrica, confort térmico absoluto y materiales nobles.
      </p>

      <!-- Botones de Acción -->
      <div class="hero-actions">
        <button 
          type="button" 
          class="btn btn--champagne" 
          (click)="scrollToSection('detalles')">
          DESCUBRIR NOVA
        </button>

        <button 
          type="button" 
          class="btn btn--outline" 
          (click)="scrollToSection('configurador')">
          SOLICITAR PRESUPUESTO
        </button>
      </div>

    </div>

    <!-- Indicador de Scroll Minimalista -->
    <div class="hero-scroll-indicator" (click)="scrollToSection('detalles')">
      <span class="scroll-text">EXPLORAR</span>
      <div class="scroll-line"></div>
    </div>

  </div>
</section>
