<div class="portal-workspace portal-workspace--ivory login-standalone">
  <div class="login-card">
    <div class="login-card__header">
      <h1>Acceso al Portal NOVA</h1>
      <p class="login-sub">Introduce tu correo corporativo y contraseña.</p>
    </div>

    <div class="login-form">
      <div class="field-group">
        <label for="loginEmail">Correo corporativo</label>
        <input id="loginEmail" type="email" [(ngModel)]="email" class="login-input" placeholder="gerencia@gruposoto.es" />
      </div>

      <div class="field-group">
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" [(ngModel)]="password" class="login-input" />
      </div>

      <button type="button" class="btn btn--champagne w-100" (click)="enterPortal()">
        Iniciar sesión →
      </button>
    </div>
  </div>
</div>
