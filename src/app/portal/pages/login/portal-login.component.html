<div class="portal-workspace portal-workspace--ivory login-standalone">
  <div class="login-card">
    <div class="login-card__header">
      <h1>Acceso al Portal NOVA</h1>
      <p class="login-sub">Introduce tu correo corporativo y contraseña.</p>
    </div>

    @if (errorMsg()) {
      <div style="border:1px solid #ef4444;color:#b91c1c;background:rgba(239,68,68,0.08);padding:0.65rem 0.85rem;font-size:0.86rem;margin-bottom:0.85rem;">
        {{ errorMsg() }}
      </div>
    }

    <div class="login-form">
      <div class="field-group">
        <label for="loginEmail">Correo corporativo</label>
        <input id="loginEmail" type="email" [(ngModel)]="email" class="login-input" placeholder="gerencia@gruposoto.es" />
      </div>

      <div class="field-group">
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" [(ngModel)]="password" class="login-input" (keyup.enter)="enterPortal()" />
      </div>

      <button type="button" class="btn btn--champagne w-100" (click)="enterPortal()">
        Iniciar sesión →
      </button>
    </div>
  </div>
</div>
