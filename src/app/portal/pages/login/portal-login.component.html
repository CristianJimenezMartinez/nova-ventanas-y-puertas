<div class="login-split">
  <div class="login-card" style="max-width:520px;margin:2rem auto;width:100%;">
    <div class="login-card__header">
      <h2>Acceso al Portal NOVA</h2>
    </div>

    <div class="login-form">
      <div class="field-group">
        <label for="loginEmail">Correo corporativo</label>
        <input id="loginEmail" type="email" [(ngModel)]="email" class="login-input" />
      </div>

      <div class="field-group">
        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" [(ngModel)]="password" class="login-input" />
      </div>

      <div class="field-group">
        <label for="loginRole">Perfil</label>
        <select id="loginRole" [(ngModel)]="selectedRole" class="login-input">
          <option value="SUPERADMIN">Administrador Total (gerencia&#64;gruposoto.es)</option>
          <option value="GERENCIA">Gerencia</option>
          <option value="OFICINA_TECNICA">Oficina Técnica</option>
          <option value="COMERCIAL">Comercial</option>
          <option value="MEDIDOR_OBRA">Almacén y Obra</option>
          <option value="ADMINISTRACION_FACTURACION">Administración</option>
        </select>
      </div>

      <button type="button" class="btn btn--champagne w-100" (click)="enterPortal()">
        Entrar al portal →
      </button>
    </div>

    <div class="quick-roles">
      <span class="quick-roles__label">Acceso rápido:</span>
      <div class="quick-roles__grid">
        <button type="button" class="role-btn" (click)="quickRoleAccess('SUPERADMIN', 'gerencia@gruposoto.es')">
          gerencia&#64;gruposoto.es
        </button>
        <button type="button" class="role-btn" (click)="quickRoleAccess('OFICINA_TECNICA', 'presupuestos@novaventanasypuertas.com')">
          Oficina Técnica
        </button>
        <button type="button" class="role-btn" (click)="quickRoleAccess('MEDIDOR_OBRA', 'almacen@novaventanasypuertas.com')">
          Almacén
        </button>
        <button type="button" class="role-btn" (click)="quickRoleAccess('ADMINISTRACION_FACTURACION', 'administracion@novaventanasypuertas.com')">
          Facturación
        </button>
      </div>
    </div>
  </div>
</div>
